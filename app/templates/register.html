{% extends "base.html" %}
{% block title %}新規登録 | スマート家計簿{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h2 class="card-title mb-4">アカウント作成</h2>
        <form method="post">
          <div class="mb-3">
            <label for="email" class="form-label">メールアドレス</label>
            <input type="email" class="form-control" id="email" name="email" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">パスワード</label>
            <input type="password" class="form-control" id="password" name="password" required>
          </div>
          <div class="mb-3">
            <label for="confirm_password" class="form-label">パスワード（確認）</label>
            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
          </div>
          <button type="submit" class="btn btn-success w-100">登録する</button>
        </form>
        <p class="mt-3 text-center">
          既にアカウントをお持ちですか？ <a href="{{ url_for('auth.login') }}">ログイン</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
